# ============================================================================
# 仓库根目录版 ShellCheck 工作流
#
# 为什么需要这个文件？
#   GitHub Actions 只识别 **仓库根目录** 的 .github/workflows/。
#   本工具集位于仓库的 fail2ban/ 子目录下，因此 fail2ban/.github/workflows/
#   里的工作流不会被触发。
#
# 启用方式（在本仓库根目录执行一次，然后提交）：
#   mkdir -p .github/workflows
#   cp fail2ban/ci/shellcheck-repo-root.yml .github/workflows/shellcheck.yml
#   git add .github/workflows/shellcheck.yml
#   git commit -m "ci: enable shellcheck workflow at repo root"
#   git push
#
# 与 fail2ban/.github/workflows/shellcheck.yml 的差异：
#   1. 所有 run 步骤带 working-directory: fail2ban
#   2. 增加 paths 过滤，仅当 fail2ban/ 有改动时触发
# ============================================================================
name: ShellCheck

on:
  push:
    branches: [ main, master ]
    paths:
      - 'fail2ban/**'
      - '.github/workflows/shellcheck.yml'
  pull_request:
    paths:
      - 'fail2ban/**'
      - '.github/workflows/shellcheck.yml'
  workflow_dispatch:

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck --version

      - name: 运行检查脚本
        working-directory: fail2ban
        run: |
          chmod +x scripts/ci-shellcheck.sh
          ./scripts/ci-shellcheck.sh

      - name: 校验 install.sh 与源脚本同步
        working-directory: fail2ban
        run: |
          chmod +x scripts/build-install.sh
          ./scripts/build-install.sh
          if ! git diff --exit-code -- install.sh; then
            echo "::error::install.sh 与 fail2ban-debian.sh 不同步，请重新运行 scripts/build-install.sh 并提交"
            exit 1
          fi
